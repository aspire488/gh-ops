telegram:
  enabled: false
  bot_token_ref: "TELEGRAM_BOT_TOKEN"
  chat_ids: []
  # Example:
  # chat_ids:
  #   - chat_id: 123456789
  #     topics:
  #       - daily_digest
  #       - oss_opportunities
  #       - security_alerts
  #   - chat_id: 987654321
  #     topics:
  #       - weekly_report

  message:
    max_length: 4096
    parse_mode: "MarkdownV2"
    split_separator: "\n\n"
    retry_attempts: 3
    retry_delay_seconds: 5
