# OSS contribution opportunity discovery, scoring, and delivery.
#
# Delegates to Phase 5's hunter, then uses Phase 3 state under the
# oss_opportunities resource key for cross-run notification dedup, so this
# workflow participates in the shared gh-ops-state cache like the other
# state-writing workflows.
name: OSS Hunter

on:
  schedule:
    # 12:00 UTC daily (17:30 IST), before the daily collection run.
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: gh-ops-state
  cancel-in-progress: false

permissions:
  contents: read
  issues: read

jobs:
  oss-hunt:
    name: OSS opportunity hunt
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state
          key: gh-ops-state-oss-hunt-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gh-ops-state-

      - name: Run oss-hunt job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GHOPS_JOB: oss-hunt
        run: python -m src.jobs

      - name: Save state
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state
          key: gh-ops-state-oss-hunt-${{ github.run_id }}-${{ github.run_attempt }}
