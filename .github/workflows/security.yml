# Dependabot and code-scanning alert collection.
#
# Permissions note: `security-events: read` is required for the code-scanning
# endpoint. The Dependabot alerts endpoint additionally requires a token with
# access to security events, which GITHUB_TOKEN may not grant; when it is
# refused the collector is recorded as a partial failure and previous state is
# preserved rather than being reported as "no alerts". See ARCHITECTURE.md,
# "Known Limitations of the Actions Layer".
name: Security

on:
  schedule:
    # 02:00 UTC daily (07:30 IST), before the daily collection run.
    # Offset from monitoring's :30 slots so the two never share a minute.
    - cron: "0 2 * * *"
  workflow_dispatch:

# Serialized with every other state-writing workflow. See daily.yml.
concurrency:
  group: gh-ops-state
  cancel-in-progress: false

permissions:
  contents: read
  security-events: read

jobs:
  security:
    name: Security alert collection
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state
        id: state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state
          key: gh-ops-state-security-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gh-ops-state-

      - name: Run security job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GHOPS_JOB: security
        run: python -m src.jobs

      - name: Save state
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state
          key: gh-ops-state-security-${{ github.run_id }}-${{ github.run_attempt }}
