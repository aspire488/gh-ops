# Weekly developer activity report.
#
# Collects the authenticated user plus issues and pulls, converts Phase 3
# events into Phase 6 activity, and delivers a DeveloperReport to Telegram.
name: Weekly Report

on:
  schedule:
    # 16:00 UTC every Monday (21:30 IST), after the daily brief window.
    - cron: "0 16 * * 1"
  workflow_dispatch:

# Serialized with every other state-writing workflow. See daily.yml.
concurrency:
  group: gh-ops-state
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  weekly-report:
    name: Weekly developer report
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state
        id: state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state
          key: gh-ops-state-weekly-report-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gh-ops-state-

      - name: Run weekly-report job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GHOPS_JOB: weekly-report
        run: python -m src.jobs

      - name: Save state
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state
          key: gh-ops-state-weekly-report-${{ github.run_id }}-${{ github.run_attempt }}
