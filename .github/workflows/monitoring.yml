# Frequent CI-failure and security-alert monitoring.
#
# Collects workflow runs and security alerts only, then runs the Phase 4
# monitors and delivers any alerts. Deliberately narrower than daily.yml so it
# can run every two hours without burning the API quota.
name: Monitoring

on:
  schedule:
    # Every two hours at :30 (offset from :00 jobs to avoid minute collisions).
    - cron: "30 */2 * * *"
  workflow_dispatch:

# Serialized with every other state-writing workflow. See daily.yml.
concurrency:
  group: gh-ops-state
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  security-events: read

jobs:
  monitoring:
    name: CI and security monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state
        id: state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state
          key: gh-ops-state-monitoring-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gh-ops-state-

      - name: Run monitoring job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GHOPS_JOB: monitoring
        run: python -m src.jobs

      - name: Save state
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state
          key: gh-ops-state-monitoring-${{ github.run_id }}-${{ github.run_attempt }}
