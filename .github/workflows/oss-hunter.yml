# OSS contribution opportunity discovery, scoring, and delivery.
#
# Delegates entirely to Phase 5's hunter. This job neither reads nor writes
# state: Phase 5 has no state layer, and inventing one would duplicate Phase 3.
# The cache steps are therefore omitted entirely rather than being included as
# no-ops.
name: OSS Hunter

on:
  schedule:
    # 10:00 UTC daily, after the daily collection run.
    - cron: "0 10 * * *"
  workflow_dispatch:

# No concurrency group is needed: this workflow never touches the shared state
# file, so a concurrent run cannot corrupt it. The hunter's only write is an
# outbound Telegram message.

permissions:
  contents: read
  issues: read

jobs:
  oss-hunt:
    name: OSS opportunity hunt
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run oss-hunt job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GHOPS_JOB: oss-hunt
        run: python -m src.jobs
