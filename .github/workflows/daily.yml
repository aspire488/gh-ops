# Daily collection and alert digest.
#
# Trigger → Python environment → gh-ops runtime → existing intelligence → Telegram.
# No business logic lives in this file: the single `run:` step hands a job name
# to the dispatcher, which routes to src/jobs/jobs.py.
#
# State persistence uses a rolling cache key. See ARCHITECTURE.md,
# "State Persistence in Actions", for the design and its limitations.
name: Daily

on:
  schedule:
    # 15:00 UTC daily (21:00 IST). Cron in Actions is always UTC.
    - cron: "0 15 * * *"
  workflow_dispatch:

# All six workflows share one state file (data/state/current_state.json), so
# they must not read-modify-write it concurrently. cancel-in-progress is false
# because cancelling a run mid-flight could discard a state update.
concurrency:
  group: gh-ops-state
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  daily:
    name: Daily collection
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state
        id: state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state
          # Unique primary key: on a fresh run it always misses, and the
          # restore-keys prefix below resolves to the most recent snapshot.
          key: gh-ops-state-daily-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gh-ops-state-

      - name: Run daily job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # The job name travels as an environment variable, never as shell
          # interpolation. See ARCHITECTURE.md, "Preventing Workflow Injection".
          GHOPS_JOB: daily
        run: python -m src.jobs

      - name: Save state
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state
          # Caches are immutable: the key must be fresh for this run attempt.
          key: gh-ops-state-daily-${{ github.run_id }}-${{ github.run_attempt }}
