# On-demand job execution for maintainers.
#
# The job name is a `choice` input, so GitHub itself constrains the value to the
# enumerated list below. It is passed to the runtime as an environment variable
# and is never interpolated into a `run:` script. See ARCHITECTURE.md,
# "Preventing Workflow Injection".
name: Manual

on:
  workflow_dispatch:
    inputs:
      job:
        description: "gh-ops job to run"
        required: true
        default: status
        type: choice
        options:
          - status
          - daily
          - monitoring
          - weekly-report
          - oss-hunt
          - security

# Shares the state concurrency group: a manual run must not interleave with a
# scheduled read-modify-write run.
concurrency:
  group: gh-ops-state
  cancel-in-progress: false

# manual.yml can dispatch any job, so it declares the union of the read scopes
# the jobs may need. It is still read-only: no workflow in V1 has a write
# permission.
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  security-events: read

jobs:
  manual:
    name: Manual job
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state
        id: state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state
          key: gh-ops-state-manual-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gh-ops-state-

      - name: Run selected job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Constrained by the `choice` input above, and passed as an
          # environment variable rather than shell interpolation.
          GHOPS_JOB: ${{ inputs.job }}
        run: python -m src.jobs

      - name: Save state
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state
          key: gh-ops-state-manual-${{ github.run_id }}-${{ github.run_attempt }}
