telegram:
  enabled: true
  # The bot token is read from this environment variable ONLY.
  # Never put the token in this file.
  bot_token_ref: "TELEGRAM_BOT_TOKEN"
  chat_ids:
    - chat_id: 2146008061
      topics:
        - alerts
        - oss_opportunities
        - developer_report
  # A chat with no `topics` receives every topic.
  # Topics: alerts, oss_opportunities, developer_report

  message:
    max_length: 4096
    parse_mode: "MarkdownV2"
    split_separator: "\n\n"
    retry_attempts: 3
    retry_delay_seconds: 5
    timeout_seconds: 10
