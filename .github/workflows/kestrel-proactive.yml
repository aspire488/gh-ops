# Kestrel proactive pass: notifications watcher, CI auto-diagnosis and the
# daily brief, delivered to Telegram. Runs without a laptop being on.
#
# Works with or without LLM keys: alerts and diagnosis are deterministic; the
# daily brief is LLM-written only when GROQ_API_KEY / GEMINI_API_KEY secrets
# exist. KESTREL_GITHUB_TOKEN (a personal token) is needed for notifications
# and cross-repo sweeps; the Actions token cannot read /notifications.
# Only sends when config/agent.yml has proactive.runner: "actions".
name: Kestrel Proactive

on:
  schedule:
    # Every 15 minutes, offset from the :00/:30 jobs.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# Serialized with every other state-writing workflow. See daily.yml.
concurrency:
  group: gh-ops-state
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  proactive:
    name: Kestrel proactive pass
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore state
        id: state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state
          key: gh-ops-state-proactive-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gh-ops-state-

      - name: Run proactive job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KESTREL_GITHUB_TOKEN: ${{ secrets.KESTREL_GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b,qwen/qwen3.8-27b,openai/gpt-oss-20b
          GEMINI_MODEL: gemini-2.5-flash
          GH_OPS_LLM_TIMEOUT_S: "45"
          GHOPS_JOB: proactive
        run: python -m src.jobs

      - name: Save state
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state
          key: gh-ops-state-proactive-${{ github.run_id }}-${{ github.run_attempt }}
